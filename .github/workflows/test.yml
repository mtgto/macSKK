name: test

# テストに関係するファイルが変更されたときだけ実行する。
# ターゲットを追加したときはそのディレクトリをpathsに追加すること。
on:
  push:
    branches: [main]
    paths:
      - 'macSKK/**'
      - 'macSKKTests/**'
      - 'SKKServClient/**'
      - 'SKKServClientTests/**'
      - 'FetchUpdateService/**'
      - 'macSKK.xcodeproj/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macSKK/**'
      - 'macSKKTests/**'
      - 'SKKServClient/**'
      - 'SKKServClientTests/**'
      - 'FetchUpdateService/**'
      - 'macSKK.xcodeproj/**'
      - '.github/workflows/test.yml'

# bashを使うようにしてpipefailを有効にする
# https://docs.github.com/ja/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#xcode
    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_27.1.app/Contents/Developer'
    - uses: actions/checkout@v7.0.1
    - name: test
      run: |
        xcodebuild -target macSKKTests -scheme macSKK DEVELOPMENT_TEAM= test | xcbeautify
        xcodebuild -target SKKServClientTests -scheme SKKServClient DEVELOPMENT_TEAM= test | xcbeautify
