name: test

# テストに関係するファイルが変更されたときだけ実行する。
# ターゲットを追加したときはそのディレクトリをpathsに追加すること。
on:
  push:
    branches: [main]
    paths:
      - 'macSKK/**'
      - 'macSKKTests/**'
      - 'SKKServClient/**'
      - 'SKKServClientTests/**'
      - 'FetchUpdateService/**'
      - 'macSKK.xcodeproj/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'macSKK/**'
      - 'macSKKTests/**'
      - 'SKKServClient/**'
      - 'SKKServClientTests/**'
      - 'FetchUpdateService/**'
      - 'macSKK.xcodeproj/**'
      - '.github/workflows/test.yml'

# bashを使うようにしてpipefailを有効にする
# https://docs.github.com/ja/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
    # https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-arm64-Readme.md#xcode
    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_27.1.app/Contents/Developer'
    - uses: actions/checkout@v7.0.1
    # 結果は.xcresultに残し、xcresult-summaryで失敗理由をジョブのサマリーとアノテーションに出す。
    # xcbeautifyだけでは並列テスト時に失敗の詳細(XCTAssertEqual failed: ...)が出ない。
    - name: test
      run: |
        xcodebuild -scheme macSKK DEVELOPMENT_TEAM= -resultBundlePath test.xcresult test | xcbeautify
    - uses: mtgto/xcresult-summary@v1.0.2
      if: ${{ !cancelled() }}
      with:
        path: test.xcresult
