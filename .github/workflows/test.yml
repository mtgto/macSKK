name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/workflows/update.yml'
      - '.github/workflows/docs.yml'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.github/workflows/update.yml'
      - '.github/workflows/docs.yml'
      - 'docs/**'

# bashを使うようにしてpipefailを有効にする
# https://docs.github.com/ja/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
    - name: Select Xcode version
      run: sudo xcode-select -s '/Applications/Xcode_26.6.app/Contents/Developer'
    - uses: actions/checkout@v7
    - name: test
      run: |
        xcodebuild -target macSKKTests -scheme macSKK DEVELOPMENT_TEAM= test | xcbeautify
        xcodebuild -target SKKServClientTests -scheme SKKServClient DEVELOPMENT_TEAM= test | xcbeautify
