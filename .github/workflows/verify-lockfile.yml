name: verify-lockfile

# ワークフローとactions.lockが食い違っていないか検証する。
# uses:を変更したら `gh actions-lock` を実行してactions.lockを更新すること。
# https://github.com/github/gh-actions-lock
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: github/gh-actions-lock@verify/v0.5.1
