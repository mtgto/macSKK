name: update

on:
  release:
    types: [released]

# bashを使うようにしてpipefailを有効にする
# https://docs.github.com/ja/actions/writing-workflows/workflow-syntax-for-github-actions#defaultsrunshell
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: calculate sha256
        id: sha256
        env:
          ASSETS: ${{ toJSON(github.event.release.assets) }}
        run: |
          browser_download_url=$(echo "${ASSETS}" | jq -r '.[] | select(.name | endswith(".dmg")) | .browser_download_url')
          SHA256=$(curl --fail -L "${browser_download_url}" | sha256sum | cut -d ' ' -f 1)
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
      - name: generate token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_MACSKK_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_MACSKK_APP_PRIVATE_KEY }}
          owner: mtgto
          repositories: homebrew-macSKK
          permission-contents: write
      - uses: actions/checkout@v7.0.1
        with:
          repository: mtgto/homebrew-macSKK
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: Casks
          path: homebrew-macSKK
      - name: Modify a Cask
        working-directory: homebrew-macSKK
        env:
          VERSION: ${{ github.event.release.tag_name }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          sed --in-place --regexp-extended "s/version \"[0-9]+\.[0-9]+\.[0-9]+\"/version \"${VERSION}\"/; s/sha256 \"[0-9a-f]{64}\"/sha256 \"${SHA256}\"/" Casks/macskk.rb
      - name: Commit & Push
        working-directory: homebrew-macSKK
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$(git diff --name-only Casks/macskk.rb)" ]; then
            # https://github.com/actions/create-github-app-token#configure-git-cli-for-an-apps-bot-user
            user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            git add --update
            git commit -m "Update Cask for version ${VERSION}"
            git push
          fi
